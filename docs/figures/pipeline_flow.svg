<svg width="100%" viewBox="0 0 680 920" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="920" fill="#FAFAFA" rx="12"/>

  <!-- Phase labels (rotated) -->
  <text x="22" y="75" font-size="10" fill="#94A3B8" font-weight="500" text-anchor="middle" transform="rotate(-90,22,75)">PHASE 1</text>
  <text x="22" y="400" font-size="10" fill="#94A3B8" font-weight="500" text-anchor="middle" transform="rotate(-90,22,400)">PHASE 2</text>

  <!-- Phase divider lines -->
  <line x1="40" y1="122" x2="650" y2="122" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="340" y="115" font-size="10" fill="#94A3B8" text-anchor="middle">tRPC  invoices.upload</text>

  <line x1="40" y1="182" x2="650" y2="182" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="340" y="177" font-size="10" fill="#94A3B8" text-anchor="middle">tRPC  invoices.process</text>

  <!-- ══ PHASE 1 ══ -->

  <!-- Browser box -->
  <rect x="55" y="30" width="148" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="129" y="52" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Browser</text>

  <!-- arrow + label -->
  <line x1="203" y1="52" x2="253" y2="52" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="228" y="44" font-size="10" fill="#378ADD" text-anchor="middle">base64 PDF</text>

  <!-- routers.ts upload box -->
  <rect x="253" y="18" width="188" height="66" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="347" y="40" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">routers.ts</text>
  <text x="347" y="58" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">invoices.upload</text>
  <text x="347" y="74" font-size="10" fill="#378ADD" text-anchor="middle" dominant-baseline="central">decode → save file</text>

  <!-- arrow to storage -->
  <line x1="441" y1="52" x2="491" y2="52" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- storage.ts box -->
  <rect x="491" y="30" width="148" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="565" y="46" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">storage.ts</text>
  <text x="565" y="62" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">local / S3</text>

  <!-- arrow down to DB -->
  <line x1="347" y1="84" x2="347" y2="102" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MySQL pending -->
  <rect x="253" y="102" width="188" height="34" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="347" y="119" font-size="11" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">MySQL — status: pending</text>

  <!-- ══ PHASE 2 ══ -->

  <!-- routers.ts process -->
  <rect x="190" y="198" width="300" height="46" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="215" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">routers.ts — invoices.process</text>
  <text x="340" y="232" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">download PDF → write temp file</text>

  <line x1="340" y1="244" x2="340" y2="268" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- classifyAndExtract -->
  <rect x="140" y="268" width="400" height="46" rx="8" fill="#EEEDFE" stroke="#7C3AED" stroke-width="0.5"/>
  <text x="340" y="285" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">python-integration.ts</text>
  <text x="340" y="302" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">classifyAndExtract(pdfPath)</text>

  <!-- Step A: health check -->
  <line x1="340" y1="314" x2="340" y2="338" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="140" y="338" width="400" height="46" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="355" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">GET :8300/health</text>
  <text x="340" y="372" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">check VLM Docker container is live</text>

  <!-- Step B: Surya OCR -->
  <line x1="340" y1="384" x2="340" y2="408" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="408" width="500" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="428" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">POST :8300/extract-pdf   (vlm_service.py)</text>
  <text x="340" y="448" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">pdf2image renders pages → Surya OCR (Greek+English) → raw text</text>

  <!-- Step C: vlm_invoice_parser -->
  <line x1="340" y1="464" x2="340" y2="488" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="488" width="500" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="340" y="508" font-size="13" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">vlm_invoice_parser.py</text>
  <text x="340" y="528" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">parses OCR text → invoice number, date, supplier, line items</text>

  <!-- Step D: classify -->
  <line x1="340" y1="544" x2="340" y2="568" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="568" width="500" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="340" y="588" font-size="13" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">detectDocumentType()  — in-process TypeScript</text>
  <text x="340" y="608" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">invoice / credit_note / cmr / dispatch_note</text>

  <!-- branch note -->
  <line x1="340" y1="624" x2="340" y2="648" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="340" y="643" font-size="10" fill="#94A3B8" text-anchor="middle">if invoice or credit_note</text>

  <!-- Step E: ML matching -->
  <rect x="90" y="648" width="500" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="668" font-size="13" font-weight="600" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">ml_product_matcher_v2.py  (per line item)</text>
  <text x="340" y="688" font-size="11" fill="#712B13" text-anchor="middle" dominant-baseline="central">direct match → rule transform → fuzzy → description match</text>

  <!-- Step F: rule learning -->
  <line x1="340" y1="704" x2="340" y2="728" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="728" width="500" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="745" font-size="13" font-weight="600" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">rule_learning_engine.py</text>
  <text x="340" y="762" font-size="11" fill="#712B13" text-anchor="middle" dominant-baseline="central">applies learned transformation rules per supplier</text>

  <!-- Step G: save -->
  <line x1="340" y1="774" x2="340" y2="798" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="90" y="798" width="500" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="818" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">invoiceDb.ts</text>
  <text x="340" y="838" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">save line items + matches → status: review_needed → notify</text>

  <!-- OptimusDB non-blocking -->
  <line x1="590" y1="826" x2="625" y2="826" stroke="#CBD5E1" stroke-width="1.2" marker-end="url(#arrow-gray)" stroke-dasharray="4 3"/>
  <text x="634" y="820" font-size="10" fill="#94A3B8">non-blocking</text>
  <text x="634" y="834" font-size="10" fill="#94A3B8">OptimusDB push</text>

  <!-- Legend -->
  <rect x="90" y="872" width="500" height="34" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
  <rect x="106" y="882" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="126" y="891" font-size="10" fill="#5F5E5A" dominant-baseline="central">Node.js</text>
  <rect x="188" y="882" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="208" y="891" font-size="10" fill="#5F5E5A" dominant-baseline="central">VLM Docker</text>
  <rect x="298" y="882" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="318" y="891" font-size="10" fill="#5F5E5A" dominant-baseline="central">Python (extraction)</text>
  <rect x="428" y="882" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="448" y="891" font-size="10" fill="#5F5E5A" dominant-baseline="central">Python (ML)</text>

</svg>
