    <text x="998" y="158" fill="#64748b">qwen_vl_local</text>
    <rect x="1196" y="146" width="48" height="18" rx="9" fill="#1e3a5f"/><text x="1220" y="159" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Path B</text>

    <!-- gemma -->
    <rect x="984" y="180" width="272" height="72" rx="10" fill="#ffffff" stroke="#1e3a5f" filter="url(#sh)"/>
    <text x="998" y="201" font-size="13" font-weight="700" fill="#1e3a5f">gemma-vl</text>
    <text x="1242" y="201" font-size="11.5" fill="#64748b" text-anchor="end" font-family="Consolas, Menlo, monospace">:8500</text>
    <text x="998" y="220" fill="#334155">Gemma 3 4B-it Q4_K_M · llama-cpp-python</text>
    <text x="998" y="238" fill="#64748b">gemma_vl_local</text>
    <rect x="1196" y="226" width="48" height="18" rx="9" fill="#1e3a5f"/><text x="1220" y="239" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Path B</text>

    <!-- qwen3vl -->
    <rect x="984" y="260" width="272" height="72" rx="10" fill="#ffffff" stroke="#1e3a5f" filter="url(#sh)"/>
    <text x="998" y="281" font-size="13" font-weight="700" fill="#1e3a5f">qwen3vl</text>
    <text x="1242" y="281" font-size="11.5" fill="#64748b" text-anchor="end" font-family="Consolas, Menlo, monospace">:8600</text>
    <text x="998" y="300" fill="#334155">Qwen3-VL-8B Q4_K_M · llama-server b6907</text>
    <text x="998" y="318" fill="#64748b">qwen3vl_local</text>
    <rect x="1196" y="306" width="48" height="18" rx="9" fill="#1e3a5f"/><text x="1220" y="319" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Path B</text>

    <!-- qwen35 -->
    <rect x="984" y="340" width="272" height="72" rx="10" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.8" filter="url(#sh)"/>
    <text x="998" y="361" font-size="13" font-weight="700" fill="#1e3a5f">qwen35</text>
    <text x="1242" y="361" font-size="11.5" fill="#64748b" text-anchor="end" font-family="Consolas, Menlo, monospace">:8800</text>
    <text x="998" y="380" fill="#334155">Qwen3.5-4B Q4_K_M · llama-server b9828</text>
    <text x="998" y="398" fill="#64748b">qwen35_local · KIE LLM</text>
    <rect x="1196" y="386" width="48" height="18" rx="9" fill="#1e3a5f"/><text x="1220" y="399" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Path B</text>

    <!-- mineru -->
    <rect x="984" y="420" width="272" height="72" rx="10" fill="#ffffff" stroke="#047857" filter="url(#sh)"/>
    <text x="998" y="441" font-size="13" font-weight="700" fill="#047857">mineru-service</text>
    <text x="1242" y="441" font-size="11.5" fill="#64748b" text-anchor="end" font-family="Consolas, Menlo, monospace">:8700</text>
    <text x="998" y="460" fill="#334155">MinerU pipeline (CPU) → Markdown</text>
    <text x="998" y="478" fill="#64748b">mineru · auto for scans</text>
    <rect x="1196" y="466" width="48" height="18" rx="9" fill="#047857"/><text x="1220" y="479" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Path A</text>

    <!-- paddle -->
