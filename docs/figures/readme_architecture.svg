    <text x="1242" y="521" font-size="11.5" fill="#64748b" text-anchor="end" font-family="Consolas, Menlo, monospace">:8900</text>
    <text x="998" y="540" fill="#334155">PP-StructureV3 (el) + optional KIE</text>
    <text x="998" y="558" fill="#64748b">paddle_ocr</text>
    <rect x="1170" y="546" width="74" height="18" rx="9" fill="#047857"/><text x="1207" y="559" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Path A / B</text>
