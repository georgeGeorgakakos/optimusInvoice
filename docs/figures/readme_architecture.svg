  <!-- ============ LEGEND / FOOTER ============ -->
  <rect x="24" y="650" width="1232" height="92" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-size="12">
    <rect x="44" y="670" width="48" height="18" rx="9" fill="#047857"/><text x="68" y="683" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Path A</text>
    <text x="102" y="683" fill="#334155"><tspan font-weight="700">Reader</tspan> → Markdown/text → local semantic LLM → JSON (same post-processing as text PDFs)</text>
    <rect x="44" y="698" width="48" height="18" rx="9" fill="#1e3a5f"/><text x="68" y="711" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">Path B</text>
    <text x="102" y="711" fill="#334155"><tspan font-weight="700">Vision model</tspan> → JSON directly → vision_postprocess + vision_validator (flag, never fix)</text>
    <text x="102" y="732" fill="#64748b">Every sidecar lives in its own container because their torch / transformers / llama.cpp versions cannot share one Python environment.</text>

    <path d="M830 679 L870 679" stroke="#E8472A" stroke-width="2" marker-end="url(#ahc)"/><text x="880" y="683" fill="#334155">HTTP to the extraction stack</text>
    <path d="M830 707 L870 707" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/><text x="880" y="711" fill="#334155">tRPC / SQL / REST</text>
    <path d="M1050 679 L1090 679" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ah)"/><text x="1100" y="683" fill="#334155">LLM reuse</text>
    <rect x="1050" y="698" width="40" height="18" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="1100" y="711" fill="#334155">planned</text>
  </g>
</svg>
