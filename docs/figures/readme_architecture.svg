  <!-- ============ ARROWS ============ -->
  <!-- browser -> app -->
  <path d="M256 148 L292 148" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
  <!-- app -> externals -->
  <path d="M296 300 L262 290" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M296 330 L262 355" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M296 360 L262 425" stroke="#475569" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
