  <text x="490" y="22" font-size="11" fill="#94A3B8" font-weight="600" text-anchor="middle">Libraries used</text>
  <line x1="40" y1="30" x2="650" y2="30" stroke="#CBD5E1" stroke-width="0.5"/>

  <!-- ── Row 1: vlm_service.py ── -->
  <rect x="55" y="42" width="240" height="58" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="175" y="62" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">vlm_service.py</text>
  <text x="175" y="80" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">FastAPI · Surya OCR engine</text>
  <text x="175" y="94" font-size="10" fill="#1D9E75" text-anchor="middle" dominant-baseline="central">runs inside Docker :8300</text>
  <line x1="295" y1="71" x2="330" y2="71" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
