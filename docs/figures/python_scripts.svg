  <text x="175" y="306" font-size="11" fill="#712B13" text-anchor="middle" dominant-baseline="central">header + line item extraction</text>
  <text x="175" y="322" font-size="11" fill="#712B13" text-anchor="middle" dominant-baseline="central">Greek myDATA + international</text>
  <text x="175" y="334" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">fallback when VLM is down</text>
  <line x1="295" y1="305" x2="330" y2="305" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="270" width="308" height="70" rx="8" fill="#FDF0EC" stroke="#F5C4B3" stroke-width="0.5"/>
  <text x="344" y="288" font-size="11" fill="#4A1B0C" dominant-baseline="central">pdfplumber (tables + text)</text>
  <text x="344" y="306" font-size="11" fill="#4A1B0C" dominant-baseline="central">re, json, datetime, pathlib</text>
  <text x="344" y="324" font-size="11" fill="#4A1B0C" dominant-baseline="central">ocr_helper.py (local import)</text>

  <!-- ── Row 5: ocr_helper.py ── -->
  <rect x="55" y="358" width="240" height="58" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="175" y="378" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">ocr_helper.py</text>
  <text x="175" y="396" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">PDF text extraction helper</text>
  <text x="175" y="410" font-size="10" fill="#888780" text-anchor="middle" dominant-baseline="central">pdfplumber → .ocr.txt fallback</text>
  <line x1="295" y1="387" x2="330" y2="387" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="358" width="308" height="58" rx="8" fill="#F8F7F3" stroke="#D3D1C7" stroke-width="0.5"/>
  <text x="344" y="378" font-size="11" fill="#2C2C2A" dominant-baseline="central">pdfplumber (strategy 1)</text>
  <text x="344" y="398" font-size="11" fill="#2C2C2A" dominant-baseline="central">reads .ocr.txt fallback (strategy 2)</text>

  <!-- ── Row 6: ml_product_matcher_v2.py ── -->
  <rect x="55" y="434" width="240" height="70" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="175" y="452" font-size="13" font-weight="600" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">ml_product_matcher_v2.py</text>
  <text x="175" y="470" font-size="11" fill="#712B13" text-anchor="middle" dominant-baseline="central">4-algorithm product matching</text>
  <text x="175" y="486" font-size="11" fill="#712B13" text-anchor="middle" dominant-baseline="central">per line item, confidence scoring</text>
  <text x="175" y="498" font-size="10" fill="#993C1D" text-anchor="middle" dominant-baseline="central">called once per line item</text>
  <line x1="295" y1="469" x2="330" y2="469" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="434" width="308" height="70" rx="8" fill="#FDF0EC" stroke="#F5C4B3" stroke-width="0.5"/>
  <text x="344" y="452" font-size="11" fill="#4A1B0C" dominant-baseline="central">difflib.SequenceMatcher (fuzzy)</text>
  <text x="344" y="470" font-size="11" fill="#4A1B0C" dominant-baseline="central">json, logging, re, collections</text>
  <text x="344" y="488" font-size="11" fill="#4A1B0C" dominant-baseline="central">rule_learning_engine.py (import)</text>

  <!-- ── Row 7: rule_learning_engine.py ── -->
  <rect x="55" y="522" width="240" height="70" rx="8" fill="#EEEDFE" stroke="#7C3AED" stroke-width="0.5"/>
