  <text x="175" y="558" font-size="11" fill="#3C3489" text-anchor="middle" dominant-baseline="central">learns code transformation rules</text>
  <text x="175" y="574" font-size="11" fill="#3C3489" text-anchor="middle" dominant-baseline="central">fires after 3 corrections</text>
  <text x="175" y="586" font-size="10" fill="#534AB7" text-anchor="middle" dominant-baseline="central">reads/writes transformation_rules.json</text>
  <line x1="295" y1="557" x2="330" y2="557" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="522" width="308" height="70" rx="8" fill="#F5F4FE" stroke="#CECBF6" stroke-width="0.5"/>
  <text x="344" y="540" font-size="11" fill="#26215C" dominant-baseline="central">difflib.SequenceMatcher (patterns)</text>
  <text x="344" y="558" font-size="11" fill="#26215C" dominant-baseline="central">re, json, collections.Counter</text>
  <text x="344" y="576" font-size="11" fill="#26215C" dominant-baseline="central">reads/writes transformation_rules.json</text>

