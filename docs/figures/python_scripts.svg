  <text x="344" y="60" font-size="11" fill="#085041" dominant-baseline="central">fastapi, uvicorn</text>
  <text x="344" y="76" font-size="11" fill="#085041" dominant-baseline="central">surya-ocr, pdf2image, Pillow</text>
  <text x="344" y="92" font-size="11" fill="#085041" dominant-baseline="central">torch, httpx</text>

  <!-- ── Row 2: vlm_invoice_parser.py ── -->
  <rect x="55" y="118" width="240" height="58" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="175" y="138" font-size="13" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">vlm_invoice_parser.py</text>
  <text x="175" y="156" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">field parsing from OCR text</text>
  <text x="175" y="170" font-size="10" fill="#854F0B" text-anchor="middle" dominant-baseline="central">7 international invoice formats</text>
  <line x1="295" y1="147" x2="330" y2="147" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="118" width="308" height="58" rx="8" fill="#FDF6EC" stroke="#FAC775" stroke-width="0.5"/>
  <text x="344" y="138" font-size="11" fill="#412402" dominant-baseline="central">re (regex), json, argparse</text>
  <text x="344" y="158" font-size="11" fill="#412402" dominant-baseline="central">stdlib only — no pip deps</text>

  <!-- ── Row 3: document_classifier.py ── -->
  <rect x="55" y="194" width="240" height="58" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="175" y="214" font-size="13" font-weight="600" fill="#412402" text-anchor="middle" dominant-baseline="central">document_classifier.py</text>
  <text x="175" y="232" font-size="11" fill="#633806" text-anchor="middle" dominant-baseline="central">invoice / cmr / dispatch / credit</text>
  <text x="175" y="246" font-size="10" fill="#854F0B" text-anchor="middle" dominant-baseline="central">keyword scoring, Greek aware</text>
  <line x1="295" y1="223" x2="330" y2="223" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="330" y="194" width="308" height="58" rx="8" fill="#FDF6EC" stroke="#FAC775" stroke-width="0.5"/>
  <text x="344" y="214" font-size="11" fill="#412402" dominant-baseline="central">re, json, sys</text>
  <text x="344" y="234" font-size="11" fill="#412402" dominant-baseline="central">stdlib only — keyword scoring</text>

