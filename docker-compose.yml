# =============================================================================
#  OptimusInvoice — Full Stack Docker Compose
#
#  Services:
#    app            → Node.js + React (port 3000)
#    vlm            → Surya OCR + Qwen2.5-3B semantic + pdfplumber  (port 8300)
#    qwen-vl        → Qwen2.5-VL-3B vision model                    (port 8400)
#    gemma-vl       → Gemma 3 4B-it GGUF (llama.cpp)                (port 8500)
#    qwen3vl        → Qwen3-VL-8B GGUF (llama.cpp server)           (port 8600)
#    mineru-service → MinerU reader sidecar                          (port 8700)
#    mysql          → MySQL 8.0 database                            (port 3306)
#
#  Network:
#    All services share the 'optimus_ai_net' bridge network.
# =============================================================================

services:

  # ── MySQL database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: optimus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: optimus123
      MYSQL_DATABASE: invoice_automation
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - optimus
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-poptimus123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── VLM service (Surya OCR + Qwen2.5-3B GGUF semantic + dispatcher) ─────────
  vlm:
    build:
      context: ./vlm-service
      dockerfile: Dockerfile
    image: vlm-service
    container_name: vlm-service
    restart: unless-stopped
    ports:
      - "8300:8100"
    volumes:
      - type: bind
        source: ./model_cache
        target: /models
      - type: bind
        source: ./data/client_profiles
        target: /app/data/client_profiles
      - vlm-cache:/root/.cache
      - llama-models:/root/.cache/llama
    environment:
      QWEN_VL_SERVICE_URL: "http://qwen-vl:8400"
      GEMMA_VL_SERVICE_URL: "http://gemma-vl:8500"
      QWEN3VL_SERVICE_URL: "http://qwen3vl:8600"
      MINERU_SERVICE_URL: "http://mineru-service:8700"
      QWEN3VL_DPI: "90"
      HF_HOME: "/models"
      TORCH_HOME: "/models"
      LLAMA_CACHE_DIR: "/models/llama"
      MAX_PAGES: "10"
      SURYA_LANGS: "el,en"
      SEMANTIC_ENABLED: "1"
      SEMANTIC_MODEL: "qwen2.5:3b"
      SEMANTIC_TIMEOUT: "120"
      LLAMA_N_THREADS: "10"
      LLAMA_N_THREADS_BATCH: "10"
      LLAMA_N_CTX: "4096"
      LLAMA_N_BATCH: "512"
      SEMANTIC_MAX_TOKENS: "1024"
      OPTIMUS_CLIENT_PROFILE: "/app/data/client_profiles/metro.json"
      mem_limit: 20g
    networks:
      - optimus
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 900s
    depends_on:
      mysql:
        condition: service_healthy

  # ── Qwen2.5-VL-3B vision service ────────────────────────────────────────────
  qwen-vl:
    build:
      context: ./qwen-vl-service
      dockerfile: Dockerfile
    image: qwen-vl-service
    container_name: optimus_qwen_vl
    restart: unless-stopped
    ports:
      - "8400:8400"
    volumes:
      - type: bind
        source: ./model_cache
        target: /models
    environment:
      QWEN_VL_LOCAL_MODEL: "Qwen/Qwen2.5-VL-3B-Instruct"
      HF_HOME: "/models"
      HF_HUB_OFFLINE: "1"
      TORCH_DEVICE: "cpu"
      PORT: "8400"
      LOG_LEVEL: "INFO"
      mem_limit: 20g
      QWEN_VL_MAX_PIXELS: "470400"
      QWEN_VL_DPI: "96"
      OMP_NUM_THREADS: "10"
      QWEN_VL_THREADS: "10"
      QWEN_VL_DTYPE: "fp32"
      QWEN_VL_LOCAL_MAX_TOKENS: "448"
    networks:
      - optimus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ── Gemma 3 4B-it vision service (llama.cpp/GGUF backend) ───────────────────
  gemma-vl:
    build:
      context: ./gemma-vl-service
      dockerfile: Dockerfile
    image: gemma-vl-service
    container_name: optimus_gemma_vl
    restart: unless-stopped
    ports:
      - "8500:8500"
    volumes:
      - type: bind
        source: ./model_cache
        target: /models
    environment:
      GEMMA_VL_REPO_ID: "ggml-org/gemma-3-4b-it-GGUF"
      GEMMA_VL_MODEL_FILE: "gemma-3-4b-it-Q4_K_M.gguf"
      GEMMA_VL_MMPROJ_FILE: "mmproj-model-f16.gguf"
      GEMMA_VL_MODEL_PATH: "/models/models--ggml-org--gemma-3-4b-it-GGUF/snapshots/d0976223747697cb51e056d85c532013931fe52e/gemma-3-4b-it-Q4_K_M.gguf"
      GEMMA_VL_MMPROJ_PATH: "/models/models--ggml-org--gemma-3-4b-it-GGUF/snapshots/d0976223747697cb51e056d85c532013931fe52e/mmproj-model-f16.gguf"
      HF_HOME: "/models"
      HF_HUB_OFFLINE: "${GEMMA_HF_HUB_OFFLINE:-1}"
      HF_TOKEN: "${HF_TOKEN:-}"
      PORT: "8500"
      LOG_LEVEL: "INFO"
      mem_limit: 20g
      LLAMA_N_THREADS: "10"
      LLAMA_N_THREADS_BATCH: "10"
      LLAMA_N_CTX: "4096"
      LLAMA_N_BATCH: "1024"
      GEMMA_MAX_NEW_TOKENS: "512"
      GEMMA_VL_DPI: "100"
    networks:
      - optimus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8500/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ── Qwen3-VL-8B GGUF vision sidecar (llama.cpp server, OpenAI-compatible) ───
  # --no-mmap forces a full upfront load into RAM — slower to start, but then it's actually resident and inference proceeds
  qwen3vl:
    image: ${QWEN3VL_LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b6907}
    container_name: optimus_qwen3vl
    restart: unless-stopped
    mem_limit: 25g
    volumes:
      - type: bind
        source: ./model_cache
        target: /models
    environment:
      LLAMA_CACHE: "/models/llama"
    command: >
      -m /models/qwen3vl/Qwen3VL-8B-Instruct-Q4_K_M.gguf
      --mmproj /models/qwen3vl/mmproj-Qwen3VL-8B-Instruct-F16.gguf
      --host 0.0.0.0
      --port 8600
      --ctx-size 4096
      --threads 10
      --parallel 1
      --no-mmproj-offload
      --no-mmap
      --temp 0.2
      --top-k 20
      --top-p 0.8
      -n 2048
    ports:
      - "8600:8600"
    networks:
      - optimus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8600/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 240s

  # ── MinerU reader sidecar (document parser → Markdown) ──────────────────────
  mineru-service:
    build:
      context: ./mineru-service
      dockerfile: Dockerfile
    image: mineru-service
    container_name: optimus_mineru
    restart: unless-stopped
    ports:
      - "8700:8700"
    volumes:
      - type: bind
        source: ./model_cache
        target: /models
    environment:
      PORT: "8700"
      LOG_LEVEL: "INFO"
      MINERU_BACKEND: "pipeline"
      MINERU_DEVICE_MODE: "cpu"
      MINERU_LANG: "el"
      HF_HOME: "/models"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "8"
      mem_limit: 16g
    networks:
      - optimus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8700/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  # ── Node.js app (React + Express + tRPC) ────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: optimus-app
    container_name: optimus-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "mysql://root:optimus123@mysql:3306/invoice_automation"
      VLM_SERVICE_URL: "http://vlm:8100"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production-generate-64-char-hex}"
      VLM_ENGINE: "${VLM_ENGINE:-auto}"
      VLM_TIMEOUT: "600000"
      BUSINESS_PORTAL_API_KEY: "${BUSINESS_PORTAL_API_KEY:-}"
    volumes:
      - uploads:/app/uploads
      - type: bind
        source: ./data/client_profiles
        target: /app/data/client_profiles
    depends_on:
      mysql:
        condition: service_healthy
      vlm:
        condition: service_healthy
    networks:
      - optimus

volumes:
  mysql-data:
  vlm-cache:
  llama-models:
  uploads:

networks:
  optimus:
    external: true
    name: optimus_ai_net